project:
  type: website
  output-dir: _site          # 렌더 결과 (docs/_site) — Documenter의 docs/build 에 해당

website:
  title: "감염미생물학 — 환경·확률·분포"
  description: "간호학과 감염미생물학 12–14주차 교안과 Julia 시뮬레이션 데모"
  site-url: "https://ecoinfoai.github.io/im-modelling/"
  repo-url: "https://github.com/ecoinfoai/im-modelling"
  page-navigation: true
  navbar:
    left:
      - href: index.qmd
        text: 소개
      - text: 교안
        menu:
          - href: chapters/ch1.qmd
            text: "Ch.1 환경과 감염병"
          - href: chapters/ch2.qmd
            text: "Ch.2 확률"
          - href: chapters/ch3.qmd
            text: "Ch.3 분포"
  page-footer:
    center: "감염미생물학 교안 · 부산보건대학교"

format:
  html:
    theme: [cosmo, styles.scss]
    toc: true
    toc-depth: 3
    toc-title: "목차"
    fig-align: center
    fig-cap-location: bottom
    code-fold: true
    code-summary: "코드 보기"
    link-external-newwindow: true

lang: ko

# 모든 페이지 하단에 라이선스·저작권을 자동으로 붙인다. 챕터는 검색·딥링크로 바로
# 진입하므로 index 한 곳에만 두면 표시가 닿지 않는다. 외부 인용 그림의 예외는
# 한 줄 표시로 담을 수 없어 index.qmd 의 「저작권 및 이용」 절이 받는다.
license: "CC BY-NC-SA"
copyright: "© 2026 정광석, 부산보건대학교 간호학과"

# Quarto 의 한국어 기본값이 '라이센스' 라 표준 표기로 교정한다.
language:
  section-title-reuse: "라이선스"
  appendix-view-license: "라이선스 보기"

# Julia 실행 엔진. 결과를 freeze 해 두면 재렌더가 빠르고, gh-pages 배포 시 CI에 Julia가 없어도 된다.
engine: julia
execute:
  freeze: auto
  warning: false
  echo: true
